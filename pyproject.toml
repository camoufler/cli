[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camaflouge-cli"
version = "0.1.0"
description = "Local CPU-only LLM CLI to download small Ollama models and standardize English text."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
keywords = ["ollama", "llm", "cli", "english", "local"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = ["ollama>=0.4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build", "twine"]

[project.scripts]
camaflouge-cli = "camaflouge_cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/camaflouge_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/camaflouge_cli/data/config.example.json" = "camaflouge_cli/data/config.example.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
